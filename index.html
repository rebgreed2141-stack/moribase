<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>こどもの森保育園業務管理システム</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#4d7f3c">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div class="app-shell">
    <header class="hero-banner">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="system-title">
          <span>こどもの森保育園</span>
          <strong>業務管理システム</strong>
        </div>
        <div class="today-panel" aria-label="今日の日付">
          <span id="todayYear" class="today-year"></span>
          <span id="todayDate" class="today-date"></span>
          <span id="todayWeek" class="today-week"></span>
        </div>
      </div>
    </header>

    <main>
      <section id="homeView" class="view active" aria-label="業務メニュー">
        <div id="mainMenu" class="menu-grid"></div>

        <div class="status-grid" aria-label="園の状況">
          <button id="childStatusButton" class="status-card status-green" type="button">
            <span class="status-label">園児数</span>
            <span class="status-value"><strong id="childCount">－</strong><span class="status-unit">名</span></span>
            <span class="status-hint">本日の出席・欠席を見る</span>
          </button>
          <button id="staffStatusButton" class="status-card status-blue" type="button">
            <span class="status-label">職員数</span>
            <span class="status-value"><strong id="staffCount">－</strong><span class="status-unit">名</span></span>
            <span class="status-hint">本日の欠席者を見る</span>
          </button>
          <button id="scheduleButton" class="status-card status-yellow" type="button">
            <span class="status-label">予定</span>
            <span class="status-placeholder">今後の予定</span>
            <span class="status-hint">今後実装します</span>
          </button>
          <button id="noticeButton" class="status-card status-pink" type="button">
            <span class="status-label">連絡事項</span>
            <span class="status-placeholder">連絡事項</span>
            <span class="status-hint">今後実装します</span>
          </button>
        </div>
      </section>

      <section id="subView" class="view" aria-labelledby="subTitle">
        <div class="sub-heading">
          <button id="backButton" class="back-button" type="button">← メニューへ戻る</button>
          <div>
            <p id="subNumber" class="section-number"></p>
            <h2 id="subTitle"></h2>
            <p id="subDescription"></p>
          </div>
        </div>
        <div id="subMenu" class="sub-menu-grid"></div>
      </section>
    </main>

    <footer>
      <span>Version 0.3.0</span>
      <span>こどもの森保育園</span>
    </footer>
  </div>

  <div id="detailModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div>
          <p id="modalDate" class="modal-date"></p>
          <h2 id="modalTitle"></h2>
        </div>
        <button id="modalCloseButton" class="modal-close" type="button" aria-label="閉じる">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>

  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
